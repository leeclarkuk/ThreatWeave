name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node packages/cli/dist/bin.js validate examples/northwind.threatweave.json
      - run: npm run eval:sim
  # The browser journey (npm run e2e) needs Chromium and is run manually; see CONTRIBUTING.md.
